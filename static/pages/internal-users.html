<div id="page-internal-users" class="page">
    <div class="mb-6"><h2 class="text-2xl font-bold text-gray-900">Internal Users</h2><p class="text-gray-600 mt-1">Kelola akun dan permission reader MediaMTX berdasarkan path atau regex.</p></div>
    <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
        <div class="overflow-x-auto"><table class="w-full"><thead class="bg-gray-50"><tr><th class="px-6 py-3 text-left">User</th><th class="px-6 py-3 text-left">Path / Regex</th><th class="px-6 py-3 text-left">Permissions</th><th class="px-6 py-3 text-left">Action</th></tr></thead><tbody id="internal-users-body"><tr><td colspan="4" class="px-6 py-8 text-center text-gray-500">Loading...</td></tr></tbody></table></div>
    </div>
    <div class="mt-6 bg-white rounded-lg border border-gray-200 p-6"><h3 class="font-medium mb-4">Add internal user</h3><form id="internal-user-form" class="space-y-4"><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><label class="block text-sm font-medium text-gray-700">Username<input id="internal-user-name" required autocomplete="off" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2"></label><label class="block text-sm font-medium text-gray-700">Password<input id="internal-user-password" required type="password" autocomplete="new-password" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2"></label></div><label class="block text-sm font-medium text-gray-700">Path / Regex<input id="internal-user-path" required placeholder="~^atcs-kota/(.+)" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 font-mono"></label><div class="flex flex-wrap gap-4 text-sm"><label><input type="checkbox" name="new-permission" value="read" checked> read</label><label><input type="checkbox" name="new-permission" value="playback"> playback</label></div><button class="rounded-md bg-blue-600 px-4 py-2 text-white" type="submit">Add user</button><p id="internal-user-status" class="text-sm text-gray-500"></p></form></div>
</div>
