<div id="page-runtime-logs" class="page">
    <div class="mb-6">
        <p class="text-gray-600 mt-1">Server log viewer</p>
    </div>

    <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
        <div
            class="px-6 py-4 border-b border-gray-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4"
        >
            <h3 class="text-lg font-medium text-gray-900">Log Entries</h3>
            <div class="flex items-center gap-4">
                <button
                    id="logs-filter-toggle"
                    type="button"
                    class="px-3 py-2 text-sm border border-gray-300 text-gray-600 rounded-lg hover:bg-gray-50 transition-colors"
                    title="Filter log backend"
                >
                    <svg id="logs-filter-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414A1 1 0 0114 14.414V19l-4 2v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
                    </svg>
                </button>
                <div class="relative">
                    <svg
                        class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                        ></path>
                    </svg>
                    <input
                        type="text"
                        id="logs-search"
                        placeholder="Search logs..."
                        class="pl-10 pr-4 py-2 w-64 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                    />
                </div>
                <select
                    id="logs-level-filter"
                    class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                >
                    <option value="">All Levels</option>
                    <option value="DEBUG">DEBUG</option>
                    <option value="INF">INFO</option>
                    <option value="WAR">WARN</option>
                    <option value="ERR">ERROR</option>
                </select>
                <button
                    id="logs-refresh"
                    class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
                >
                    <svg
                        class="w-4 h-4 inline mr-1"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                        ></path>
                    </svg>
                    Refresh
                </button>
            </div>
        </div>
        <div class="overflow-x-auto max-h-[450px] overflow-y-auto relative">
            <table class="w-full border-collapse">
                <thead class="bg-gray-50 sticky top-0 z-10 shadow-sm">
                    <tr>
                        <th
                            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                        >
                            Timestamp
                        </th>
                        <th
                            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                        >
                            Level
                        </th>
                        <th
                            class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                        >
                            Message
                        </th>
                    </tr>
                </thead>
                <tbody
                    id="logs-body"
                    class="divide-y divide-gray-200 font-mono text-sm"
                >
                    <tr>
                        <td
                            colspan="3"
                            class="px-6 py-12 text-center text-gray-500"
                        >
                            Loading...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="px-6 py-4 border-t border-gray-200 flex items-center justify-between">
            <div id="logs-page-info" class="text-sm text-gray-500">Page 1 of 1</div>
            <div class="flex items-center gap-2">
                <button
                    id="logs-prev-page"
                    onclick="changeLogsPage(-1)"
                    class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                >
                    Previous
                </button>
                <button
                    id="logs-next-page"
                    onclick="changeLogsPage(1)"
                    class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                >
                    Next
                </button>
            </div>
        </div>

        <div
            id="logs-filter-modal"
            class="fixed inset-0 z-50 hidden items-center justify-center bg-black bg-opacity-50"
            role="dialog"
            aria-modal="true"
            aria-labelledby="logs-filter-title"
        >
            <div class="w-full max-w-md mx-4 rounded-lg bg-white p-6 shadow-xl">
                <div class="flex items-center justify-between mb-5">
                    <h2 id="logs-filter-title" class="text-lg font-medium text-gray-900">Filter Riwayat Log</h2>
                    <button id="logs-filter-close" type="button" class="text-gray-400 hover:text-gray-600" aria-label="Close">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>

                <div class="space-y-4">
                    <div>
                        <label for="logs-filter-date" class="block text-sm font-medium text-gray-700 mb-1">Tanggal</label>
                        <input
                            type="date"
                            id="logs-filter-date"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                        />
                    </div>
                    <fieldset>
                        <legend class="block text-sm font-medium text-gray-700 mb-2">Level Log</legend>
                        <div class="grid grid-cols-3 gap-2">
                            <label class="flex items-center gap-2 rounded-lg border border-gray-200 px-3 py-2 text-sm">
                                <input type="checkbox" name="logs-filter-level" value="DEBUG" class="rounded border-gray-300">
                                DEBUG
                            </label>
                            <label class="flex items-center gap-2 rounded-lg border border-gray-200 px-3 py-2 text-sm">
                                <input type="checkbox" name="logs-filter-level" value="WAR" class="rounded border-gray-300">
                                WARN
                            </label>
                            <label class="flex items-center gap-2 rounded-lg border border-gray-200 px-3 py-2 text-sm">
                                <input type="checkbox" name="logs-filter-level" value="ERR" class="rounded border-gray-300">
                                ERROR
                            </label>
                        </div>
                    </fieldset>
                </div>

                <div class="mt-6 flex justify-between gap-3">
                    <button
                        id="logs-filter-reset"
                        type="button"
                        class="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50"
                    >
                        Reset Filter
                    </button>
                    <div class="flex gap-3">
                        <button
                            id="logs-filter-cancel"
                            type="button"
                            class="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-50"
                        >
                            Batal
                        </button>
                        <button
                            id="logs-filter-apply"
                            type="button"
                            class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700"
                        >
                            Terapkan
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
